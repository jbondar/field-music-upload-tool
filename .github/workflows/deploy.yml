name: Trigger deploy

# This app has no deploy of its own. In the homelab it runs as the `upload`
# service in jbondar/web-services, built on the host from a checkout of this
# repo -- see that repo's .github/workflows/deploy-upload.yml.
#
# On a merge to main this pokes that workflow (repository_dispatch), so a
# change here reaches prod without anyone clicking "Run workflow". The deploy
# workflow fast-forwards the host checkout and rebuilds only the upload
# container; an unchanged build is a cache hit, so a redundant poke is cheap.
#
# Needs a repo secret WEBSERVICES_DEPLOY_TOKEN: a fine-grained PAT for
# jbondar/web-services with "Contents: write" (GitHub requires that permission
# for the dispatches endpoint even though nothing is written), or a classic
# token with the `repo` scope. Without it this step fails loudly rather than
# silently skipping a deploy.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-deploy
  cancel-in-progress: true

jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - name: Ask web-services to redeploy the upload service
        env:
          TOKEN: ${{ secrets.WEBSERVICES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::WEBSERVICES_DEPLOY_TOKEN is not set -- add it in this repo's Settings > Secrets"
            exit 1
          fi
          code=$(curl -sS -o /dev/stderr -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jbondar/web-services/dispatches \
            -d "{\"event_type\":\"upload-updated\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}")
          echo
          # 204 No Content is success for this endpoint.
          [ "$code" = "204" ] || { echo "::error::dispatch failed (HTTP $code)"; exit 1; }
          echo "dispatched upload-updated to jbondar/web-services"
